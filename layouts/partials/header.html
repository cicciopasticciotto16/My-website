<div class="site-header">

	<!-- Brand: logo che ruota + titolo -->
	<div class="site-header__brand">

		<span class="site-header__logo bg-blue-500 fill-white rounded-full p-2">
			<svg class="site-header__logo-icon fill-white" xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
				<path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path>
				<path d="M13.997 5.17a5 5 0 0 0-8.101-4.09A5 5 0 0 0 1.28 9.342a5 5 0 0 0 8.336 5.109 3.5 3.5 0 0 0 5.201-4.065 3.001 3.001 0 0 0-.822-5.216zm-1-.034a1 1 0 0 0 .668.977 2.001 2.001 0 0 1 .547 3.478 1 1 0 0 0-.341 1.113 2.5 2.5 0 0 1-3.715 2.905 1 1 0 0 0-1.262.152 4 4 0 0 1-6.67-4.087 1 1 0 0 0-.2-1 4 4 0 0 1 3.693-6.61 1 1 0 0 0 .8-.2 4 4 0 0 1 6.48 3.273z"></path>
			</svg>
		</span>

		{{ if .IsHome }}<h1 class="site-header__title text-3xl md:text-4xl font-bold"><a class="hover:underline" href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></h1>
		{{ else }}<h2 class="site-header__title text-3xl md:text-4xl font-bold"><a class="hover:underline" href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></h2>{{ end }}

	</div>

	<!-- Link delle sezioni su fondo blu, separati dal brand da un'onda -->
	<div class="site-header__links">

		<!-- Onda verticale (da tablet in su) -->
		<svg class="site-header__wave site-header__wave--v" viewBox="0 0 24 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
			<path fill="currentColor" d="M24 0H12c-8 12.5 8 12.5 0 25s8 12.5 0 25 8 12.5 0 25 8 12.5 0 25h12z"/>
		</svg>

		<!-- Onda orizzontale (su mobile i due blocchi sono impilati) -->
		<svg class="site-header__wave site-header__wave--h" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true" focusable="false">
			<path fill="currentColor" d="M0 24V12c12.5-8 12.5 8 25 0s12.5 8 25 0 12.5 8 25 0 12.5 8 25 0v12z"/>
		</svg>

		{{- partial "menu.html" (dict "menuID" "main" "page" .) -}}

	</div>

</div>
